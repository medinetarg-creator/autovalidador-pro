<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>MYM KARAOKE</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #09090b; overflow: hidden; }
  iframe {
    display: block; border: 0; width: 100%;
    height: 100vh;          /* fallback */
    height: 100dvh;         /* móvil: respeta la barra del navegador */
  }
  #aviso {
    position: fixed; inset: auto 0 0 0; padding: 10px 14px; text-align: center;
    font: 13px -apple-system, Segoe UI, Roboto, sans-serif;
    color: #a1a1aa; background: rgba(9,9,11,.92);
  }
  #aviso a { color: #f472b6; }
  .oculto { display: none !important; }
</style>
</head>
<body>

  <!-- App publicada en Google Apps Script (se abre dentro de este marco).
       El modo se pasa por la URL de esta misma página: ?modo=cabina -->
  <iframe id="app" src="about:blank" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="aviso" class="oculto">
    Si la pantalla queda en negro: <a id="link-directo" href="#">abrí la app acá</a>
  </div>

<script>
  // ==== ÚNICA LÍNEA A CAMBIAR SI SE REDESPLIEGA ====
  var APP = "https://script.google.com/macros/s/AKfycbzaal32iuShS3iQJ0aNJfzTUPPOqqwaMid5sQZfUv6JOxGBwKF6fQS6X5QPZRSXubCz/exec";

  // Pasa el ?modo=cabina (y cualquier otro parámetro) a la app
  var qs = window.location.search || "";
  var destino = APP + qs;

  var marco = document.getElementById("app");
  marco.src = destino;
  document.getElementById("link-directo").href = destino;

  // Si en 12 s el marco no cargó nada, mostramos el atajo
  var cargado = false;
  marco.addEventListener("load", function () { cargado = true; });
  setTimeout(function () {
    if (!cargado) document.getElementById("aviso").classList.remove("oculto");
  }, 12000);
</script>
</body>
</html>
